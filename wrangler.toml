name = "osint-news-aggregator"
main = "src/index.js"
compatibility_date = "2026-07-31"

# Cron triggers: 7am, 1pm, 7pm UTC-4 (que es 11am, 5pm, 11pm UTC)
# Workers FREE plan: hasta 3 cron triggers por Worker ✅
[triggers]
crons = ["0 11 * * *", "0 17 * * *", "0 23 * * *"]

# Variables de entorno (no sensibles)
[vars]
FROM_EMAIL = "osint-resumen@resend.dev"

# SECRETS REQUERIDOS (configurar con wrangler secret put):
#
#   wrangler secret put GEMINI_API_KEY
#   → Pega tu API key de Google AI Studio
#   → Ejemplo: AQ.
#
#   wrangler secret put EMAIL_API_KEY
#   → Pega tu API key de Resend (https://resend.com)
#   → Ejemplo: re_
#
# NOTA: Las API keys se almacenan encriptadas por Cloudflare.
#       Nunca se exponen en el código ni en los logs.
