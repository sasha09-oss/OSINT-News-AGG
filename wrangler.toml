name = "osint-news-aggregator"
main = "src/index.js"
compatibility_date = "2026-07-31"

# Cron triggers: 7am, 1pm, 7pm UTC-4 (que es 11am, 5pm, 11pm UTC)
# Workers FREE plan: hasta 3 cron triggers por Worker ✅
[triggers]
crons = ["0 11 * * *", "0 17 * * *", "0 23 * * *"]

# Variables de entorno
[vars]
FROM_EMAIL = "osint-resumen@resend.dev"

